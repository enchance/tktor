[supervisord]
nodaemon=true

[program:fastapi]
command=fastapi dev
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:jupyter]
command=jupyter lab --ip=0.0.0.0 --port=8888 --allow-root --no-browser
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
