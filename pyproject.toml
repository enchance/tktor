[project]
name = "tktor"
version = "0.1.0"
description = ""
authors = [
    {name = "enchance",email = "enchance@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi[standard] (>=0.115.12,<0.116.0)",
    "sqlmodel (>=0.0.24,<0.0.25)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "icecream (>=2.1.4,<3.0.0)",
    "python-decouple (>=3.8,<4.0)",
    "arrow (>=1.3.0,<2.0.0)",
    "orjson (>=3.10.16,<4.0.0)",
    "firebase-admin (>=6.7.0,<7.0.0)",
    "pyrebase4 (>=4.8.0,<5.0.0)",
    "python-json-logger (>=3.3.0,<4.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "redis-om[async] (>=0.3.3,<0.4.0)",
    "hiredis (>=3.1.0,<4.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "alembic (>=1.15.2,<2.0.0)",
    "jupyterlab (>=4.3.6,<5.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "numpy (>=2.2.4,<3.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "python-binance (>=1.0.28,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
faker = "^37.1.0"
