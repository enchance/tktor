x-base: &envbase
  restart: no
  tty: true
  env_file:
    - .env

services:
  app:
    image: tktor-app:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: tktor
    <<: *envbase
    ports:
      - "8000:8000"
      - "8888:8888"
    volumes:
      - .:/app
#      - ./dev/supervisor.conf:/app/supervisor.conf
    develop:
      watch:
        - action: rebuild
          path: Dockerfile.dev
        - action: rebuild
          path: requirements.txt
    depends_on:
      - pgdb
      - redis
#      - mailhog
    command: ["fastapi", "dev", "--host", "0.0.0.0"]
#    command: ["supervisord", "-c", "/app/dev/supervisor.conf"]


  pgdb:
    image: tktor-postgres:latest
    build:
      context: .
      dockerfile: dev/Dockerfile.postgres.dev
    container_name: tktordb
    <<: *envbase
    ports:
      - "5432:5432"
    volumes:
      - tktordb:/var/lib/postgresql/data
    develop:
      watch:
        - action: rebuild
          path: dev/Dockerfile.postgres.dev
        - action: rebuild
          path: dev/sql/seeder.sql

  redis:
    image: redis/redis-stack:latest
    container_name: tktorcache
    <<: *envbase
    ports:
      - "6379:6379"
      - "8010:8001"
    volumes:
      - tktorcache:/data

#  mailhog:
#    container_name: mail-service
#    image: mailhog/mailhog:latest
#    restart: no
#    ports:
#      - "1025:1025"
#      - "8025:8025"

#  jupyter:
#    image: quay.io/jupyter/scipy-notebook:python-3.12
#    container_name: jupyter
#    ports:
#      - "8888:8888"

volumes:
  tktordb:
  tktorcache: